databaseChangeLog:
  - changeSet:
      id: 002
      author: supportFlowApp

      changes:
        - createTable:
            tableName: tickets

            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: title
                  type: VARCHAR(150)
                  constraints:
                    nullable: false

              - column:
                  name: description
                  type: VARCHAR(2000)
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: VARCHAR(50)
                  constraints:
                    nullable: false

              - column:
                  name: priority
                  type: VARCHAR(50)
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

              - column:
                  name: employee_id
                  type: BIGINT

        - addForeignKeyConstraint:
            baseTableName: tickets
            baseColumnNames: employee_id
            referencedTableName: employees
            referencedColumnNames: id
            constraintName: fk_ticket_employee

        - createIndex:
            tableName: tickets
            indexName: idx_ticket_status
            columns:
              - column:
                  name: status