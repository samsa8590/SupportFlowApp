spring:
  application:
    name: supportflow
    devtools:
        restart:
          enabled: false

  datasource:
    url: jdbc:postgresql://localhost:5432/supportflow
    username: supportflow
    password: supportflow_dev
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml