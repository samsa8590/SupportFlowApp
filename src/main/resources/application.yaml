spring:
  application:
    name: supportflow

  devtools:
    restart:
      enabled: false

  datasource:
    url: jdbc:postgresql://localhost:5433/supportflow
    username: ${DB_USERNAME:supportflow}
    password: ${DB_PASSWORD:supportflow_dev}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    show-sql: true
    hibernate:
      ddl-auto: validate

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

  springdoc:
    api-docs:
      path: /v3/api-docs
      enabled: true
    swagger-ui:
      path: /swagger-ui.html
      enabled: true
      operations-sorter: method
      tags-sorter: alpha
      try-it-out-enabled: true
      disable-swagger-default-url: true