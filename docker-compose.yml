services:
  postgres:
    image: postgres:17
    container_name: supportflow-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: supportflow
      POSTGRES_USER: supportflow
      POSTGRES_PASSWORD: supportflow_dev

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supportflow -d supportflow"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: